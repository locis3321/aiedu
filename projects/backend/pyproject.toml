[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "aiedu"
version = "0.1.0"
description = "AI数学教学平台：输入一道K12数学题，产出已核验、引导式思考、可交互的课程"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "pyjwt>=2.8",
    "psycopg[binary]>=3.1",
    "agentscope==2.0.9",
    "sympy>=1.12",
    "boto3>=1.34",
    "httpx>=0.27",
    "cryptography>=42",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
]

[project.optional-dependencies]
# TTS 备选供应商 edge-tts（微软 Edge TTS，免费无 key）；默认 MiMo 走 httpx 无需额外依赖
tts = ["edge-tts>=6.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "ruff>=0.5",
    "moto>=5.2.3",
]

[tool.ruff]
line-length = 100
exclude = ["migrations/versions", ".e2e"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends/Header in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m \"not e2e\""
markers = [
    "e2e: end-to-end tests requiring the full local stack (compose up)",
    "real_llm: tests calling the real LLM provider (external dependency; CI may retry)",
]
