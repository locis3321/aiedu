# 本地开发基础设施：PostgreSQL 16 + Redis（+ 可选 MinIO 作为 S3 兼容适配目标）
# 用法：docker compose -f infra/compose.yaml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiedu
      POSTGRES_PASSWORD: aiedu
      POSTGRES_DB: aiedu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiedu -d aiedu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 可选：S3 兼容对象存储。开发默认使用本地磁盘适配器（STORAGE_BACKEND=local），
  # 需要验证 S3 路径时再启用本服务并设置 STORAGE_BACKEND=s3。
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data


  # 可观测性：OpenTelemetry → Grafana Tempo（接收 OTLP）→ Grafana UI
  # 用法：docker compose -f infra/compose.yaml up -d tempo grafana
  # 查看：http://localhost:3000 选择 Grafana → 菜单 Explore → Tempo 数据源
  tempo:
    image: nexus.aihosp.demo.healthan.com.cn/grafana/tempo:2.7.0
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - tempo-data:/var/tempo
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "3200:3200"

  grafana:
    image: nexus.aihosp.demo.healthan.com.cn/grafana/grafana:11.5.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro


volumes:
  pgdata:
  miniodata:
  tempo-data:
  grafana-data:
