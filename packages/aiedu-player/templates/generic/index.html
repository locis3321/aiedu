<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自由设计课程演示：分数的意义</title>
  <style>
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      margin: 0; padding: 16px;
      background: linear-gradient(180deg, #fdf6ff 0%, #f3e8ff 100%);
      color: #4a3b5c;
    }
    #app { max-width: 960px; margin: 0 auto; }
    h1 { font-size: clamp(22px, 4vw, 30px); color: #7b4fa6; margin-bottom: 4px; }
    .subtitle { font-size: 15px; color: #9c86b8; margin-bottom: 12px; }
    .panel {
      background: #fffdfd; border-radius: 20px; padding: 18px;
      margin-bottom: 12px; box-shadow: 0 4px 14px rgba(123,79,166,.12);
      border: 2px solid #e6d9f5;
    }
    #question { font-size: 20px; margin-bottom: 8px; }
    #prompt { font-size: 17px; margin-bottom: 8px; }
    #blocks-stage { min-height: 120px; border-radius: 12px; background: #faf7ff; padding: 12px; }
    button {
      min-width: 44px; min-height: 44px; font-size: 16px;
      border-radius: 14px; border: none; cursor: pointer;
      background: #f3e8ff; color: #7b4fa6;
      padding: 0 14px;
    }
    button.primary { background: #9c6fd1; color: #fff; }
    button.primary:hover { background: #8a5cbf; }
    #answer-input {
      min-height: 44px; font-size: 18px; width: 150px;
      border-radius: 14px; border: 2px solid #e6d9f5;
      padding: 0 10px; background: #fffdfd; color: #4a3b5c;
    }
    #feedback { min-height: 44px; display: flex; align-items: center; font-size: 17px; }
    @media (max-width: 600px) { body { padding: 8px; } .panel { padding: 12px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    .theme-badge {
      display: inline-block; background:#f3e8ff; color:#7b4fa6;
      border-radius:999px; padding:2px 10px; font-size:12px;
    }
</style>
</head>
<body>
<div id="app">
<h1>🍕分数的意义</h1>
<div class="subtitle">自由设计课程（LLM planner + skill）演示</div>
<div class="panel">
<div id="question">认识分数</div>
<div id="prompt"></div>
<div id="blocks-stage"></div>
<div id="controls" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
<input id="answer-input" type="text" inputmode="text" placeholder="输入答案">
<button id="submit-btn" class="primary">提交✨</button>
<button id="continue-btn" style="display:none;">继续➡️</button>
<button id="hint-btn">提示💡</button>
<button id="replay-btn">重播🔁</button>
<button id="reset-btn">重置🔄</button>
</div>
<div id="feedback"></div>
<div id="status" style="font-size:13px;color:#9c86b8;margin-top:8px;"></div>
</div>
</div>
<script src="/dist/player.js"></script>
<script>
(async function () {
const spec = await (await fetch("/demo/free-design-fraction.json")).json();
const mount = document.getElementById("blocks-stage");
const handle = window.AIEduPlayer.loadSpec(spec, mount);
const runtime = handle.runtime;
const promptEl = document.getElementById("prompt");
const feedbackEl = document.getElementById("feedback");
const statusEl = document.getElementById("status");
const input = document.getElementById("answer-input");

function refresh() {
const node = runtime.current;
if (node) {
promptEl.textContent = node.prompt || node.narration || "";
statusEl.textContent = `节点：${node.id}（${node.type}）｜会话：${runtime.sessionStatus}`;
document.getElementById("continue-btn").style.display =
INTERACTIVE_TYPES.includes(node.type) ? "none" : "inline-block";
}
const violations = window.AIEduPlayer.checkLayout(mount);
if (violations.length > 0) {
statusEl.textContent += "｜布局违规：" + violations.map(v => v.issue).join("；");
}
}

const INTERACTIVE_TYPES = ["predict", "construct", "manipulate", "retrieve", "prove"];
document.getElementById("submit-btn").addEventListener("click", () => {
const node = runtime.current;
if (node && !INTERACTIVE_TYPES.includes(node.type)) {
runtime.continue();
refresh();
return;
}
const result = runtime.answer(input.value);
if (result.correct) {
feedbackEl.textContent = result.feedback + " 🎉";
feedbackEl.style.color = "#2e7d32";
} else {
feedbackEl.textContent = result.feedback + " 💪再想想，你离答案很近啦！";
feedbackEl.style.color = "#c62828";
}
refresh();
input.value = "";
});
document.getElementById("continue-btn").addEventListener("click", () => {
runtime.continue();
refresh();
});
document.getElementById("hint-btn").addEventListener("click", () => {
const hint = runtime.assist();
feedbackEl.textContent = hint ?? "没有更多提示了";
feedbackEl.style.color = "#1565c0";
});
document.getElementById("replay-btn").addEventListener("click", () => {
runtime.replay();
refresh();
});
document.getElementById("reset-btn").addEventListener("click", () => {
runtime.reset();
refresh();
});
refresh();
})();
</script>
</body>
</html>
