[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiedu_mcp"]

[project]
name = "aiedu-mcp"
version = "0.1.0"
description = "数芽 MCP Server：把数学可信教学引擎（SymPy 核验 + 教学门禁 + 答案门控渲染）暴露给 AI Agent，stdio 与 HTTP 双传输，5 个 tool"
readme = { text = "数芽 MCP Server：verify_math / generate_lesson / get_lesson / submit_attempt / render_lesson 五个 tool，stdio 与 HTTP 双传输。数学对错由 SymPy 判定，未覆盖题型显式 capability gap。", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "aiedu contributors" }]
keywords = ["mcp", "model-context-protocol", "math", "education", "sympy", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "fastmcp==4.1.3",
    "aiedu-core>=0.1.0",
]

[project.optional-dependencies]
# LLM 为可选路径（2026-10-21 决策 B 后已解耦）：
# agentscope↔fastmcp 的 mcp 版本硬冲突已通过"llm 路径改 httpx 直连"从根上消除，
# 因此 aiedu-mcp 重新提供 [llm] extra（透传 aiedu-core[llm] 的 httpx）。
# 注意：匿名 + LLM env + HTTP 传输的启动硬拒绝仍生效（防免费暴露 LLM 成本）。
llm = [
    "aiedu-core[llm]>=0.1.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
aiedu-mcp = "aiedu_mcp.server:main"

[project.urls]
Homepage = "https://github.com/locis3321/aiedu"
Repository = "https://github.com/locis3321/aiedu"
Issues = "https://github.com/locis3321/aiedu/issues"
Source = "https://github.com/locis3321/aiedu"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
