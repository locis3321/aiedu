[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiedu_mcp"]

[project]
name = "aiedu-mcp"
version = "0.1.0"
description = "数芽 MCP Server：把数学可信教学引擎（SymPy 核验 + 教学门禁 + 答案门控渲染）暴露给 AI Agent，stdio 与 HTTP 双传输，5 个 tool"
readme = { text = "数芽 MCP Server：verify_math / generate_lesson / get_lesson / submit_attempt / render_lesson 五个 tool，stdio 与 HTTP 双传输。数学对错由 SymPy 判定，未覆盖题型显式 capability gap。", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "aiedu contributors" }]
keywords = ["mcp", "model-context-protocol", "math", "education", "sympy", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "fastmcp==4.1.3",
    "aiedu-core>=0.1.0",
]

[project.optional-dependencies]
# ⚠️ LLM 路径（aiedu-core 的 llm_router 用 agentscope）与 MCP 层**不兼容于同一环境**（已实测确认）：
#   agentscope 2.0.9 硬性要求 `mcp<2.0.0`，而 fastmcp 4.1.3 需要 `mcp>=2.0.0`。
#   - 用 `--no-deps` 装 agentscope 在全新环境**不可用**（缺 jinja2/aiofiles 等运行时依赖）；
#   - 全量安装会把 mcp SDK 降级到 1.x，fastmcp 直接崩溃。
# 因此 aiedu-mcp **不提供 [llm] extra**，产品语义为：
#   - 无 LLM env：模板外题面显式 capability_gap（能力诚实）；
#   - 设了 LLM env：模板外题面 → 显式报错（依赖缺失），不静默降级。
# 需要 LLM 自由设计的场景请在**独立环境**使用 aiedu-core 的 Python API（`pip install aiedu-core[llm]`）。
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
aiedu-mcp = "aiedu_mcp.server:main"

[project.urls]
Homepage = "https://github.com/locis3321/aiedu"
Repository = "https://github.com/locis3321/aiedu"
Issues = "https://github.com/locis3321/aiedu/issues"
Source = "https://github.com/locis3321/aiedu"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
